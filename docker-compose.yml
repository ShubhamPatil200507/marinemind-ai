version: '3.8'

services:
  marinemind-backend:
    build: .
    container_name: marinemind-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./marinemind.db
      - JWT_SECRET=marinemind-ai-orca-secure-jwt-secret-key-2024
      # Optional free Google Gemini key
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./marinemind.db:/app/marinemind.db
    restart: unless-stopped
