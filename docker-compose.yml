version: '3.8'

services:
  marinemind-db:
    image: postgis/postgis:16-3.4
    container_name: marinemind_postgis
    environment:
      POSTGRES_DB: marinemind
      POSTGRES_USER: marine_admin
      POSTGRES_PASSWORD: marine_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data: